name: Auto Committer

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      commit_count:
        description: "Exact number of commits to create (leave empty to use the random range in config.sh)"
        required: false
        default: ""
        type: string

concurrency:
  group: auto-committer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The default GITHUB_TOKEN is sufficient; no extra secret needed.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Always start from the latest remote state.
          ref: ${{ vars.AUTO_COMMIT_BRANCH || 'main' }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "yonela-johannes"
          git config --global user.email "johannesyonela@gmail.com"
          # Keep line endings stable so repeated runs can't produce noisy diffs.
          git config --global core.autocrlf false
          git config --global core.safecrlf false

      - name: Validate repository state
        run: |
          echo "=== Git Status ==="
          git status --short --branch
          echo "=== Current Branch ==="
          git branch -v
          echo "=== Commit History (last 5) ==="
          git log --oneline -5

      - name: Run random commit script
        id: commit
        env:
          COMMIT_COUNT_OVERRIDE: ${{ inputs.commit_count }}
        run: |
          chmod +x scripts/random_commit.sh
          if [ -n "${COMMIT_COUNT_OVERRIDE:-}" ]; then
            if ! [[ "$COMMIT_COUNT_OVERRIDE" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::commit_count must be a positive integer, got '$COMMIT_COUNT_OVERRIDE'"
              exit 1
            fi
            printf 'MIN_COMMITS=%s\nMAX_COMMITS=%s\n' \
              "$COMMIT_COUNT_OVERRIDE" "$COMMIT_COUNT_OVERRIDE" >> config.sh
            echo "Overriding commit count: $COMMIT_COUNT_OVERRIDE"
          fi
          ./scripts/random_commit.sh

      - name: Upload workflow log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: workflow.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Report status
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          echo "Commits Made: ${{ steps.commit.outputs.count || '0' }}"
          echo "Target Branch: ${{ steps.commit.outputs.branch || vars.AUTO_COMMIT_BRANCH || 'main' }}"
